# Runs the test suite on every pull request (and on pushes to main).
# The green tick on each PR is visible evidence for Criterion 2.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy   # headless pygame
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v
